<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Possession.com — Admin Panel</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

        :root {
            --bg:        #0d0018;
            --card:      rgba(35, 15, 65, 0.75);
            --input:     rgba(20, 8, 40, 0.9);
            --purple:    #7b2fbe;
            --purple-lt: #9d4edd;
            --border:    rgba(157, 78, 221, 0.3);
            --text:      #ede9f6;
            --muted:     #a78fbf;
            --dim:       #6b5a80;
            --green:     #2ecc71;
            --red:       #e74c3c;
            --gold:      #fbbf24;
            --orange:    #f39c12;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Pro', Georgia, serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(100,30,180,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 70% at 80% 90%, rgba(60,10,120,0.12) 0%, transparent 60%);
            color: var(--text);
            min-height: 100vh;
            font-size: 16px;
        }

        /* Header */
        .header {
            background: rgba(13,0,24,0.95);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(14px);
        }
        .header-logo { font-family: 'Cinzel', serif; font-size: 1.2em; font-weight: 700; letter-spacing: 0.05em; text-shadow: 0 0 20px rgba(157,78,221,0.5); }
        .logout-btn { padding: 7px 18px; background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4); border-radius: 6px; color: #ff8a80; font-size: 14px; font-family: 'Crimson Pro', serif; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { background: rgba(231,76,60,0.3); }

        /* Auth */
        .auth-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 62px); padding: 20px; }
        .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 40px rgba(157,78,221,0.2); }
        .auth-box h2 { font-family: 'Cinzel', serif; font-size: 1.2em; text-align: center; margin-bottom: 28px; }
        .auth-box input { width: 100%; padding: 11px 14px; margin-bottom: 14px; background: var(--input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 16px; font-family: 'Crimson Pro', serif; transition: border-color 0.2s; }
        .auth-box input:focus { outline: none; border-color: var(--purple-lt); }
        .auth-box button { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--purple), var(--purple-lt)); border: none; border-radius: 8px; color: #fff; font-size: 1em; font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; }
        .auth-box button:hover { box-shadow: 0 0 22px rgba(157,78,221,0.5); transform: translateY(-1px); }
        .auth-error { color: #ff6b6b; text-align: center; margin-top: 12px; font-size: 0.9em; display: none; }

        /* Layout */
        .admin-wrap { display: none; }
        .page-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }

        /* Main tabs */
        .main-tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
        .main-tab { padding: 12px 24px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-size: 1em; font-family: 'Crimson Pro', serif; cursor: pointer; transition: all 0.2s; margin-bottom: -1px; }
        .main-tab:hover { color: var(--text); }
        .main-tab.active { color: var(--purple-lt); border-bottom-color: var(--purple-lt); }
        .main-tab-content { display: none; }
        .main-tab-content.active { display: block; }

        /* Sub tabs */
        .sub-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .sub-tab { padding: 8px 18px; background: var(--input); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-size: 0.88em; cursor: pointer; transition: all 0.2s; font-family: 'Crimson Pro', serif; }
        .sub-tab:hover { color: var(--text); border-color: var(--purple-lt); }
        .sub-tab.active { background: rgba(157,78,221,0.2); color: var(--purple-lt); border-color: var(--purple-lt); }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
        .stat-number { font-family: 'Cinzel', serif; font-size: 2.2em; font-weight: 700; color: var(--purple-lt); }
        .stat-label { color: var(--muted); font-size: 0.88em; margin-top: 4px; }

        /* Item cards */
        .item-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--purple); border-radius: 10px; padding: 22px 24px; margin-bottom: 16px; }
        .item-card.pending  { border-left-color: var(--gold); }
        .item-card.approved { border-left-color: var(--green); }
        .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
        .card-title { font-family: 'Cinzel', serif; font-size: 1.05em; color: var(--text); margin-bottom: 4px; }
        .card-meta  { color: var(--muted); font-size: 0.85em; line-height: 1.6; }
        .card-body  { color: #d0d0d0; line-height: 1.65; margin: 12px 0; }

        .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
        .status-pending  { background: rgba(251,191,36,0.15); color: var(--gold);  border: 1px solid rgba(251,191,36,0.3); }
        .status-approved { background: rgba(46,204,113,0.15); color: var(--green); border: 1px solid rgba(46,204,113,0.3); }

        /* Buttons */
        .card-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 8px 16px; border: 1px solid transparent; border-radius: 6px; font-weight: 600; font-size: 0.88em; cursor: pointer; transition: all 0.2s; font-family: 'Crimson Pro', serif; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-approve   { background: rgba(46,204,113,0.15);  color: var(--green);     border-color: rgba(46,204,113,0.35); }
        .btn-approve:hover:not(:disabled)   { background: rgba(46,204,113,0.28); }
        .btn-delete    { background: rgba(231,76,60,0.15);   color: #ff8a80;          border-color: rgba(231,76,60,0.35); }
        .btn-delete:hover:not(:disabled)    { background: rgba(231,76,60,0.28); }
        .btn-unapprove { background: rgba(243,156,18,0.15);  color: var(--orange);    border-color: rgba(243,156,18,0.35); }
        .btn-unapprove:hover:not(:disabled) { background: rgba(243,156,18,0.28); }
        .btn-export    { background: rgba(52,152,219,0.15);  color: #74b9ff;          border-color: rgba(52,152,219,0.35); }
        .btn-export:hover:not(:disabled)    { background: rgba(52,152,219,0.28); }
        .btn-edit      { background: rgba(157,78,221,0.15);  color: var(--purple-lt); border-color: rgba(157,78,221,0.35); }
        .btn-edit:hover:not(:disabled)      { background: rgba(157,78,221,0.28); }
        .btn-save      { background: rgba(46,204,113,0.2);   color: var(--green);     border-color: rgba(46,204,113,0.4); }
        .btn-save:hover:not(:disabled)      { background: rgba(46,204,113,0.35); }
        .btn-cancel    { background: rgba(107,90,128,0.2);   color: var(--muted);     border-color: rgba(107,90,128,0.35); }
        .btn-cancel:hover:not(:disabled)    { background: rgba(107,90,128,0.35); }

        /* Host preview */
        .host-preview { display: grid; grid-template-columns: 160px 1fr; gap: 20px; margin: 14px 0; }
        @media (max-width: 600px) { .host-preview { grid-template-columns: 1fr; } }
        .host-images { display: flex; flex-direction: column; gap: 8px; }
        .host-images img { width: 100%; border-radius: 6px; border: 1px solid var(--border); aspect-ratio: 3/4; object-fit: cover; }
        .host-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-content: start; }
        .detail-item { background: var(--input); border-radius: 6px; padding: 10px 12px; }
        .detail-label { color: var(--dim); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.05em; }
        .detail-value { color: var(--text); margin-top: 3px; font-size: 0.95em; }

        /* Edit panel */
        .edit-panel { display: none; margin-top: 20px; background: rgba(10,4,24,0.85); border: 1px solid var(--purple-lt); border-radius: 10px; padding: 24px; }
        .edit-panel.open { display: block; }
        .edit-panel-title { font-family: 'Cinzel', serif; font-size: 0.85em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple-lt); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .edit-section-title { font-family: 'Cinzel', serif; font-size: 0.75em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

        .edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 8px; }
        .edit-field { display: flex; flex-direction: column; gap: 6px; }
        .edit-field label { color: var(--dim); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.06em; }
        .edit-field input,
        .edit-field textarea,
        .edit-field select { padding: 9px 12px; background: var(--input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 15px; font-family: 'Crimson Pro', serif; transition: border-color 0.2s; width: 100%; appearance: none; }
        .edit-field input:focus,
        .edit-field textarea:focus,
        .edit-field select:focus { outline: none; border-color: var(--purple-lt); box-shadow: 0 0 0 3px rgba(157,78,221,0.15); }
        .edit-field textarea { min-height: 90px; resize: vertical; }
        .edit-field-full { grid-column: 1 / -1; }

        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 8px; }

        .img-url-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
        .img-url-row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
        .img-url-thumb { width: 64px; height: 85px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); background: var(--input); }

        .edit-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

        /* JSON */
        .json-box { background: rgba(10,5,20,0.9); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-top: 14px; font-family: 'Courier New', monospace; font-size: 12px; color: #90ee90; max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; display: none; }
        .json-hint { color: var(--muted); font-size: 0.82em; margin-top: 8px; display: none; }

        /* States */
        .loading-state { text-align: center; padding: 48px; color: var(--muted); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--purple-lt); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 56px 20px; color: var(--dim); font-style: italic; }
        .stars { color: var(--gold); letter-spacing: 1px; }

        /* Toast */
        .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { background: #1a0a30; border: 1px solid var(--border); border-radius: 6px; padding: 12px 18px; font-size: 0.9em; box-shadow: 0 8px 28px rgba(0,0,0,0.5); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: all; max-width: 300px; }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 3px solid var(--green); color: #9effc5; }
        .toast.error   { border-left: 3px solid var(--red);   color: #ff8a80; }
        .toast.info    { border-left: 3px solid var(--purple-lt); color: var(--text); }
    </style>
</head>
<body>

<header class="header">
    <div class="header-logo">🔐 Possession.com — Admin</div>
    <button class="logout-btn" id="logoutBtn" style="display:none" onclick="window._logout()">Logout</button>
</header>

<div class="auth-wrap" id="authWrap">
    <div class="auth-box">
        <h2>Admin Login</h2>
        <input type="email"    id="adminEmail"    placeholder="Email address"  autocomplete="email">
        <input type="password" id="adminPassword" placeholder="Password"       autocomplete="current-password">
        <button onclick="window._login()">Login</button>
        <div class="auth-error" id="authError"></div>
    </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="page-wrap">

    <div class="main-tabs">
        <button class="main-tab active" onclick="switchMain('reviews',this)">📝 Reviews</button>
        <button class="main-tab"        onclick="switchMain('hosts',this)">👤 Host Requests</button>
        <button class="main-tab"        onclick="switchMain('sessions',this)">👻 Sessions</button>
    </div>

    <!-- REVIEWS -->
    <div id="tab-reviews" class="main-tab-content active">
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="rPending">—</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number" id="rApproved">—</div><div class="stat-label">Approved</div></div>
            <div class="stat-card"><div class="stat-number" id="rTotal">—</div><div class="stat-label">Total</div></div>
        </div>
        <div class="sub-tabs">
            <button class="sub-tab active" onclick="switchSub('reviews','pending',this)">Pending</button>
            <button class="sub-tab"        onclick="switchSub('reviews','approved',this)">Approved</button>
            <button class="sub-tab"        onclick="switchSub('reviews','all',this)">All</button>
        </div>
        <div id="reviews-pending"  class="sub-tab-content active"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
        <div id="reviews-approved" class="sub-tab-content"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
        <div id="reviews-all"      class="sub-tab-content"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
    </div>

    <!-- HOSTS -->
    <div id="tab-hosts" class="main-tab-content">
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="hPending">—</div><div class="stat-label">Pending Hosts</div></div>
            <div class="stat-card"><div class="stat-number" id="hApproved">—</div><div class="stat-label">Approved Hosts</div></div>
            <div class="stat-card"><div class="stat-number" id="hTotal">—</div><div class="stat-label">Total Requests</div></div>
        </div>
        <div class="sub-tabs">
            <button class="sub-tab active" onclick="switchSub('hosts','pending',this)">Pending</button>
            <button class="sub-tab"        onclick="switchSub('hosts','approved',this)">Approved</button>
            <button class="sub-tab"        onclick="switchSub('hosts','all',this)">All</button>
        </div>
        <div id="hosts-pending"  class="sub-tab-content active"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
        <div id="hosts-approved" class="sub-tab-content"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
        <div id="hosts-all"      class="sub-tab-content"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
    </div>

    <!-- SESSIONS -->
    <div id="tab-sessions" class="main-tab-content">
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="sPending">—</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number" id="sTotal">—</div><div class="stat-label">Total Sessions</div></div>
        </div>
        <div id="sessions-list"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
    </div>

  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp }                             from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword,
         signOut, onAuthStateChanged }               from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
    apiKey:            "AIzaSyC_-3gi8bWDy4WGVBIBzsc2bEEG4qe0Qus",
    authDomain:        "reviews-48f44.firebaseapp.com",
    databaseURL:       "https://reviews-48f44-default-rtdb.firebaseio.com",
    projectId:         "reviews-48f44",
    storageBucket:     "reviews-48f44.firebasestorage.app",
    messagingSenderId: "978976687091",
    appId:             "1:978976687091:web:a9a6cdc13e6570ab598886"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

let allReviews  = {};
let allHosts    = {};
let allSessions = {};

/* ── Auth ──────────────────────────────────── */
onAuthStateChanged(auth, user => {
    if (user) {
        document.getElementById('authWrap').style.display  = 'none';
        document.getElementById('adminWrap').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'block';
        loadAll();
    } else {
        document.getElementById('authWrap').style.display  = 'flex';
        document.getElementById('adminWrap').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'none';
    }
});
window._login = async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const pass  = document.getElementById('adminPassword').value;
    const errEl = document.getElementById('authError');
    errEl.style.display = 'none';
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch { errEl.textContent = 'Invalid email or password.'; errEl.style.display = ''; }
};
window._logout = () => signOut(auth);
document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') window._login(); });

/* ── Tabs ──────────────────────────────────── */
window.switchMain = (name, btn) => {
    document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.main-tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
};
window.switchSub = (section, name, btn) => {
    const wrap = document.getElementById('tab-' + section);
    wrap.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    wrap.querySelectorAll('.sub-tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(section + '-' + name).classList.add('active');
};

/* ── Data loaders ──────────────────────────── */
function loadAll() { loadReviews(); loadHosts(); loadSessions(); }

function loadReviews() {
    onValue(ref(db, 'reviews'), snap => {
        allReviews = {};
        const pending = [], approved = [];
        snap.forEach(child => {
            const r = { id: child.key, ...child.val() };
            allReviews[child.key] = r;
            (r.approved === true ? approved : pending).push(r);
        });
        document.getElementById('rPending').textContent  = pending.length;
        document.getElementById('rApproved').textContent = approved.length;
        document.getElementById('rTotal').textContent    = pending.length + approved.length;
        renderReviews('reviews-pending',  pending);
        renderReviews('reviews-approved', approved);
        renderReviews('reviews-all',      [...pending, ...approved]);
    }, err => toast('Reviews error: ' + err.message, 'error'));
}

function loadHosts() {
    onValue(ref(db, 'hostRequests'), snap => {
        allHosts = {};
        const pending = [], approved = [];
        snap.forEach(child => {
            const h = { id: child.key, ...child.val() };
            allHosts[child.key] = h;
            (h.approved === true ? approved : pending).push(h);
        });
        document.getElementById('hPending').textContent  = pending.length;
        document.getElementById('hApproved').textContent = approved.length;
        document.getElementById('hTotal').textContent    = pending.length + approved.length;
        renderHosts('hosts-pending',  pending);
        renderHosts('hosts-approved', approved);
        renderHosts('hosts-all',      [...pending, ...approved]);
    }, err => toast('Hosts error: ' + err.message, 'error'));
}

function loadSessions() {
    onValue(ref(db, 'sessions'), snap => {
        allSessions = {};
        const all = []; let pending = 0;
        snap.forEach(child => {
            const s = { id: child.key, ...child.val() };
            allSessions[child.key] = s;
            all.push(s);
            if (s.status === 'pending') pending++;
        });
        document.getElementById('sPending').textContent = pending;
        document.getElementById('sTotal').textContent   = all.length;
        renderSessions(all);
    }, err => toast('Sessions error: ' + err.message, 'error'));
}

/* ── Render reviews ────────────────────────── */
function renderReviews(containerId, reviews) {
    const el = document.getElementById(containerId);
    if (!reviews.length) { el.innerHTML = '<div class="empty-state">No reviews here</div>'; return; }
    reviews.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

    el.innerHTML = reviews.map(r => {
        const date    = r.timestamp ? new Date(r.timestamp).toLocaleString() : 'No date';
        const pending = r.approved !== true;
        const user    = r.reviewerName || r.user || 'Unknown';
        const text    = r.reviewText   || r.text  || '';
        const rating  = r.rating || 0;
        const stars   = '★'.repeat(rating) + '☆'.repeat(5 - rating);

        return `
        <div class="item-card ${pending?'pending':'approved'}" id="rcard-${r.id}">
            <div class="card-head">
                <div>
                    <div class="card-title">Review for: ${esc(r.hostName||'Unknown Host')}</div>
                    <div class="card-meta">by ${esc(user)} &middot; ${date}</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span class="stars">${stars}</span> ${rating}/5
                    <span class="status-pill ${pending?'status-pending':'status-approved'}">${pending?'Pending':'Approved'}</span>
                </div>
            </div>
            <div class="card-body">${esc(text).replace(/\n/g,'<br>')}</div>
            <div class="card-actions">
                ${pending
                    ? `<button class="btn btn-approve"   onclick="doReview('approve','${r.id}',this)">✓ Approve</button>`
                    : `<button class="btn btn-unapprove" onclick="doReview('unapprove','${r.id}',this)">↩ Unapprove</button>`}
                <button class="btn btn-edit"   onclick="toggleEdit('redit-${r.id}')">✏️ Edit</button>
                <button class="btn btn-delete" onclick="doReview('delete','${r.id}',this)">✗ Delete</button>
            </div>

            <div class="edit-panel" id="redit-${r.id}">
                <div class="edit-panel-title">✏️ Edit Review</div>
                <div class="edit-grid">
                    <div class="edit-field">
                        <label>Host Name</label>
                        <input type="text" id="re-hostName-${r.id}" value="${esc(r.hostName||'')}">
                    </div>
                    <div class="edit-field">
                        <label>Reviewer Name</label>
                        <input type="text" id="re-reviewer-${r.id}" value="${esc(user)}">
                    </div>
                    <div class="edit-field">
                        <label>Rating</label>
                        <select id="re-rating-${r.id}">
                            ${[1,2,3,4,5].map(n=>`<option value="${n}"${rating===n?' selected':''}>${n} Star${n>1?'s':''}</option>`).join('')}
                        </select>
                    </div>
                    <div class="edit-field edit-field-full">
                        <label>Review Text</label>
                        <textarea id="re-text-${r.id}">${esc(text)}</textarea>
                    </div>
                </div>
                <div class="edit-actions">
                    <button class="btn btn-save"   onclick="saveReview('${r.id}',this)">💾 Save Changes</button>
                    <button class="btn btn-cancel" onclick="toggleEdit('redit-${r.id}')">Cancel</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ── Render hosts ──────────────────────────── */
function renderHosts(containerId, hosts) {
    const el = document.getElementById(containerId);
    if (!hosts.length) { el.innerHTML = '<div class="empty-state">No host requests here</div>'; return; }
    hosts.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

    el.innerHTML = hosts.map(h => {
        const date    = h.timestamp ? new Date(h.timestamp).toLocaleString() : 'No date';
        const pending = h.approved !== true;
        const images  = Array.isArray(h.images)  ? h.images  : [];
        const reviews = Array.isArray(h.reviews) ? h.reviews : [];
        const price1  = h.prices?.['1'] ?? '';

        const imgRows = [0,1,2].map(i => {
            const src = images[i] || '';
            return `<div class="img-url-row">
                <img class="img-url-thumb" id="hthumb-${h.id}-${i}" src="${esc(src)}" onerror="this.src=''" alt="Photo ${i+1}">
                <input type="url" id="he-img${i}-${h.id}" value="${esc(src)}" placeholder="Image ${i+1} URL"
                       oninput="document.getElementById('hthumb-${h.id}-${i}').src=this.value">
            </div>`;
        }).join('');

        const priceFields = [['1','1 Hour'],['4','4 Hours'],['24','24 Hours'],['168','1 Week'],['720','1 Month']]
            .map(([k,label]) => `<div class="edit-field">
                <label>${label}</label>
                <input type="number" id="he-p${k}-${h.id}" value="${h.prices?.[k]??''}" min="0" placeholder="0">
            </div>`).join('');

        return `
        <div class="item-card ${pending?'pending':'approved'}" id="hcard-${h.id}">
            <div class="card-head">
                <div>
                    <div class="card-title">${esc(h.name||'Unnamed')}${h.age?`, ${h.age}`:''}
                        ${h.occupation?`<span style="color:var(--muted);font-weight:400;font-size:0.85em;"> — ${esc(h.occupation)}</span>`:''}
                    </div>
                    <div class="card-meta">Submitted by ${esc(h.submittedBy||'Unknown')} &middot; ${date}</div>
                </div>
                <span class="status-pill ${pending?'status-pending':'status-approved'}">${pending?'Pending':'Approved'}</span>
            </div>

            <div class="host-preview">
                <div class="host-images">
                    ${images.slice(0,3).map(img=>`<img src="${esc(img)}" alt="Host" loading="lazy" onerror="this.style.display='none'">`).join('')}
                    ${!images.length?'<div style="color:var(--dim);font-size:0.85em;font-style:italic;">No images</div>':''}
                </div>
                <div class="host-detail-grid">
                    ${detail('Price / 1hr', price1?`$${price1}`:'—')}
                    ${h.height             ? detail('Height',      h.height)             : ''}
                    ${h.weight             ? detail('Weight',      h.weight)             : ''}
                    ${h.breastSize         ? detail('Breast Size', h.breastSize)         : ''}
                    ${h.personality        ? detail('Personality', h.personality)        : ''}
                    ${h.libido             ? detail('Libido',      h.libido)             : ''}
                    ${h.responsiveness     ? detail('Responsive',  h.responsiveness)     : ''}
                    ${h.relationshipStatus ? detail('Relationship',h.relationshipStatus) : ''}
                    ${h.wealth             ? detail('Wealth',      h.wealth)             : ''}
                    ${h.skills             ? detail('Skills',      h.skills)             : ''}
                    ${detail('Reviews', reviews.length ? `${reviews.length} review${reviews.length!==1?'s':''}` : 'None yet')}
                </div>
            </div>

            <div class="card-actions">
                ${pending
                    ? `<button class="btn btn-approve"   onclick="doHost('approve','${h.id}',this)">✓ Approve</button>`
                    : `<button class="btn btn-unapprove" onclick="doHost('unapprove','${h.id}',this)">↩ Unapprove</button>`}
                <button class="btn btn-edit"   onclick="toggleEdit('hedit-${h.id}')">✏️ Edit Profile</button>
                <button class="btn btn-export" onclick="toggleJSON('${h.id}')">📋 JSON</button>
                <button class="btn btn-delete" onclick="doHost('delete','${h.id}',this)">✗ Delete</button>
            </div>

            <!-- Host edit panel -->
            <div class="edit-panel" id="hedit-${h.id}">
                <div class="edit-panel-title">✏️ Edit Host — ${esc(h.name||'')}</div>

                <div class="edit-section-title">Basic Info</div>
                <div class="edit-grid">
                    <div class="edit-field"><label>Name</label>
                        <input type="text"   id="he-name-${h.id}"  value="${esc(h.name||'')}"></div>
                    <div class="edit-field"><label>Age</label>
                        <input type="number" id="he-age-${h.id}"   value="${h.age||''}" min="18" max="99"></div>
                    <div class="edit-field"><label>Height</label>
                        <input type="text"   id="he-height-${h.id}" value="${esc(h.height||'')}"></div>
                    <div class="edit-field"><label>Weight</label>
                        <input type="text"   id="he-weight-${h.id}" value="${esc(h.weight||'')}"></div>
                    <div class="edit-field"><label>Breast Size</label>
                        <input type="text"   id="he-breast-${h.id}" value="${esc(h.breastSize||'')}"></div>
                    <div class="edit-field"><label>Occupation</label>
                        <input type="text"   id="he-occ-${h.id}"    value="${esc(h.occupation||'')}"></div>
                    <div class="edit-field"><label>Relationship Status</label>
                        <input type="text"   id="he-rel-${h.id}"    value="${esc(h.relationshipStatus||'')}"></div>
                    <div class="edit-field"><label>Sexual History</label>
                        <input type="text"   id="he-sex-${h.id}"    value="${esc(h.sexualHistory||'')}"></div>
                    <div class="edit-field"><label>Wealth</label>
                        <input type="text"   id="he-wealth-${h.id}" value="${esc(h.wealth||'')}"></div>
                    <div class="edit-field"><label>Libido</label>
                        <select id="he-libido-${h.id}">
                            ${['','Low','Moderate','High','Very High'].map(v=>
                                `<option value="${v}"${h.libido===v?' selected':''}>${v||'— Select —'}</option>`).join('')}
                        </select></div>
                    <div class="edit-field"><label>Responsiveness</label>
                        <select id="he-resp-${h.id}">
                            ${['','Low','Moderate','Responsive','Very Responsive'].map(v=>
                                `<option value="${v}"${h.responsiveness===v?' selected':''}>${v||'— Select —'}</option>`).join('')}
                        </select></div>
                    <div class="edit-field"><label>Skills (Memory Package)</label>
                        <input type="text" id="he-skills-${h.id}" value="${esc(h.skills||'')}"></div>
                    <div class="edit-field edit-field-full"><label>Personality</label>
                        <textarea id="he-personality-${h.id}">${esc(h.personality||'')}</textarea></div>
                </div>

                <div class="edit-section-title">Pricing (USD)</div>
                <div class="price-grid">${priceFields}</div>

                <div class="edit-section-title">Images</div>
                <div class="img-url-list">${imgRows}</div>

                <div class="edit-actions">
                    <button class="btn btn-save"   onclick="saveHost('${h.id}',this)">💾 Save Changes</button>
                    <button class="btn btn-cancel" onclick="toggleEdit('hedit-${h.id}')">Cancel</button>
                </div>
            </div>

            <pre  class="json-box" id="json-${h.id}"></pre>
            <div class="json-hint" id="hint-${h.id}">
                Add to <code>profile-data.json</code> under key
                <code>"${(h.name||'host').toLowerCase().replace(/\s+/g,'-')}"</code>
            </div>
        </div>`;
    }).join('');
}

/* ── Render sessions ───────────────────────── */
function renderSessions(sessions) {
    const el = document.getElementById('sessions-list');
    if (!sessions.length) { el.innerHTML = '<div class="empty-state">No sessions yet</div>'; return; }
    sessions.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    el.innerHTML = sessions.map(s => {
        const date = s.timestamp ? new Date(s.timestamp).toLocaleString() : 'No date';
        return `<div class="item-card">
            <div class="card-head">
                <div>
                    <div class="card-title">👻 ${esc(s.hostName||'Unknown Host')}</div>
                    <div class="card-meta">${date} &middot; ${esc(s.durationText||s.duration||'?')} &middot; ${esc(s.startTimeText||s.startTime||'?')}</div>
                </div>
                <span class="status-pill status-pending">${esc(s.status||'pending')}</span>
            </div>
            <div class="card-body">
                Cost: <strong>$${(s.totalCost||0).toLocaleString()}</strong>
                &nbsp;·&nbsp; Memory Package: ${s.memories?'Yes':'No'}
                &nbsp;·&nbsp; Insurance: ${s.insurance?'Yes':'No'}
            </div>
            <div class="card-actions">
                <button class="btn btn-approve" onclick="doSession('complete','${s.id}',this)">✓ Mark Complete</button>
                <button class="btn btn-delete"  onclick="doSession('delete','${s.id}',this)">✗ Delete</button>
            </div>
        </div>`;
    }).join('');
}

function detail(label, value) {
    return `<div class="detail-item">
        <div class="detail-label">${esc(String(label))}</div>
        <div class="detail-value">${esc(String(value))}</div>
    </div>`;
}

/* ── Toggle edit panels ────────────────────── */
window.toggleEdit = id => {
    const panel = document.getElementById(id);
    if (!panel) return;
    const opening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    if (opening) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

/* ── Save review ───────────────────────────── */
window.saveReview = async (id, btn) => {
    btn.disabled = true; btn.textContent = 'Saving…';
    const reviewer = document.getElementById(`re-reviewer-${id}`)?.value.trim();
    const text     = document.getElementById(`re-text-${id}`)?.value.trim();
    const updates  = {
        hostName:     document.getElementById(`re-hostName-${id}`)?.value.trim(),
        reviewerName: reviewer,
        user:         reviewer,   // keep legacy field in sync
        rating:       parseInt(document.getElementById(`re-rating-${id}`)?.value),
        reviewText:   text,
        text:         text        // keep legacy field in sync
    };
    // Drop empty values
    Object.keys(updates).forEach(k => { if (!updates[k] && updates[k] !== 0) delete updates[k]; });
    try {
        await update(ref(db, `reviews/${id}`), updates);
        toast('Review saved ✓', 'success');
        toggleEdit('redit-' + id);
    } catch (err) {
        toast('Save failed: ' + err.message, 'error');
    } finally { btn.disabled = false; btn.textContent = '💾 Save Changes'; }
};

/* ── Save host ─────────────────────────────── */
window.saveHost = async (id, btn) => {
    btn.disabled = true; btn.textContent = 'Saving…';

    const g  = fieldId => document.getElementById(fieldId)?.value.trim() || '';
    const gn = fieldId => { const v = document.getElementById(fieldId)?.value; return v !== '' && v !== undefined ? Number(v) : null; };

    const images = [0,1,2].map(i => g(`he-img${i}-${id}`)).filter(Boolean);

    const raw = {
        name:               g(`he-name-${id}`),
        age:                gn(`he-age-${id}`),
        height:             g(`he-height-${id}`),
        weight:             g(`he-weight-${id}`),
        breastSize:         g(`he-breast-${id}`),
        occupation:         g(`he-occ-${id}`),
        relationshipStatus: g(`he-rel-${id}`),
        sexualHistory:      g(`he-sex-${id}`),
        wealth:             g(`he-wealth-${id}`),
        libido:             g(`he-libido-${id}`),
        responsiveness:     g(`he-resp-${id}`),
        skills:             g(`he-skills-${id}`),
        personality:        g(`he-personality-${id}`),
        images,
        prices: {
            '1':   gn(`he-p1-${id}`),
            '4':   gn(`he-p4-${id}`),
            '24':  gn(`he-p24-${id}`),
            '168': gn(`he-p168-${id}`),
            '720': gn(`he-p720-${id}`)
        }
    };

    // Remove null/empty fields so we don't wipe existing data with blanks
    function stripEmpty(obj) {
        const out = {};
        for (const [k,v] of Object.entries(obj)) {
            if (v === null || v === '' || v === undefined) continue;
            if (typeof v === 'object' && !Array.isArray(v)) {
                const nested = stripEmpty(v);
                if (Object.keys(nested).length) out[k] = nested;
            } else {
                out[k] = v;
            }
        }
        return out;
    }

    try {
        await update(ref(db, `hostRequests/${id}`), stripEmpty(raw));
        toast('Host profile saved ✓', 'success');
        toggleEdit('hedit-' + id);
    } catch (err) {
        toast('Save failed: ' + err.message, 'error');
    } finally { btn.disabled = false; btn.textContent = '💾 Save Changes'; }
};

/* ── Approve / delete ──────────────────────── */
window.doReview = async (action, id, btn) => {
    btn.disabled = true;
    try {
        if (action === 'approve')   await update(ref(db, `reviews/${id}`), { approved: true });
        if (action === 'unapprove') await update(ref(db, `reviews/${id}`), { approved: false });
        if (action === 'delete') {
            if (!confirm('Delete this review permanently?')) { btn.disabled = false; return; }
            await remove(ref(db, `reviews/${id}`));
        }
        toast(action === 'delete' ? 'Deleted' : `Review ${action}d ✓`, 'success');
    } catch (err) { toast('Error: ' + err.message, 'error'); btn.disabled = false; }
};

window.doHost = async (action, id, btn) => {
    btn.disabled = true;
    try {
        if (action === 'approve')   await update(ref(db, `hostRequests/${id}`), { approved: true });
        if (action === 'unapprove') await update(ref(db, `hostRequests/${id}`), { approved: false });
        if (action === 'delete') {
            if (!confirm('Delete this host permanently?')) { btn.disabled = false; return; }
            await remove(ref(db, `hostRequests/${id}`));
        }
        toast(action === 'delete' ? 'Deleted' : `Host ${action}d ✓`, 'success');
    } catch (err) { toast('Error: ' + err.message, 'error'); btn.disabled = false; }
};

window.doSession = async (action, id, btn) => {
    btn.disabled = true;
    try {
        if (action === 'complete') await update(ref(db, `sessions/${id}`), { status: 'complete' });
        if (action === 'delete') {
            if (!confirm('Delete session record?')) { btn.disabled = false; return; }
            await remove(ref(db, `sessions/${id}`));
        }
        toast(action === 'delete' ? 'Deleted' : 'Marked complete ✓', 'success');
    } catch (err) { toast('Error: ' + err.message, 'error'); btn.disabled = false; }
};

/* ── JSON export ───────────────────────────── */
window.toggleJSON = id => {
    const box = document.getElementById('json-' + id);
    const hint = document.getElementById('hint-' + id);
    if (box.style.display === 'block') { box.style.display = hint.style.display = 'none'; return; }
    const h = allHosts[id]; if (!h) return;
    const clean = { name: h.name, age: h.age, prices: h.prices, images: h.images, reviews: [] };
    ['height','weight','breastSize','occupation','relationshipStatus','sexualHistory',
     'wealth','personality','libido','responsiveness','skills'].forEach(f => { if (h[f]) clean[f] = h[f]; });
    box.textContent = JSON.stringify(clean, null, 2);
    box.style.display = hint.style.display = 'block';
};

/* ── Toast ─────────────────────────────────── */
function toast(msg, type='info') {
    const c = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 350); }, 3500);
}

/* ── XSS escape ────────────────────────────── */
function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
