<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Possession.com - Review Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(20, 20, 40, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #4a0080 0%, #6a00a0 100%);
            padding: 30px;
            border-bottom: 2px solid #8a2be2;
            text-align: center;
        }

        h1 {
            color: #e0b3ff;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
        }

        .content {
            padding: 40px;
        }

        .auth-section {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(40, 40, 60, 0.5);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #6a00a0;
        }

        .auth-section input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(30, 30, 50, 0.9);
            border: 1px solid #6a00a0;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 16px;
        }

        .auth-section button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-section button:hover {
            background: linear-gradient(90deg, #8a2be2 0%, #9a4be2 100%);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        .admin-content {
            display: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #6a00a0;
        }

        .tab {
            padding: 15px 30px;
            background: rgba(40, 40, 60, 0.5);
            border: none;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            color: #b08fd1;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(60, 60, 80, 0.7);
        }

        .tab.active {
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .review-card {
            background: rgba(40, 40, 60, 0.5);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 4px solid #8a2be2;
        }

        .review-card.pending {
            border-left-color: #ffd700;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .review-info {
            flex: 1;
        }

        .review-host {
            color: #e0b3ff;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .review-meta {
            color: #b08fd1;
            font-size: 0.9em;
        }

        .review-rating {
            color: #ffd700;
            font-size: 1.2em;
        }

        .review-text {
            color: #d0d0d0;
            line-height: 1.6;
            margin: 15px 0;
            padding: 15px;
            background: rgba(30, 30, 50, 0.5);
            border-radius: 5px;
        }

        .review-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-approve {
            background: #2ecc71;
            color: white;
        }

        .btn-approve:hover {
            background: #27ae60;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }

        .btn-unapprove {
            background: #f39c12;
            color: white;
        }

        .btn-unapprove:hover {
            background: #d68910;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(40, 40, 60, 0.5);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #6a00a0;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            color: #e0b3ff;
            font-weight: bold;
        }

        .stat-label {
            color: #b08fd1;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #b08fd1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Review Administration</h1>
        </header>

        <div class="content">
            <!-- Authentication Section -->
            <div class="auth-section" id="authSection">
                <h2 style="color: #e0b3ff; margin-bottom: 20px; text-align: center;">Admin Login</h2>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
                <button onclick="authenticate()">Login</button>
            </div>

            <!-- Admin Content -->
            <div class="admin-content" id="adminContent">
                <!-- Statistics -->
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="statPending">0</div>
                        <div class="stat-label">Pending Reviews</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statApproved">0</div>
                        <div class="stat-label">Approved Reviews</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">Total Reviews</div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('pending')">Pending Reviews</button>
                    <button class="tab" onclick="switchTab('approved')">Approved Reviews</button>
                    <button class="tab" onclick="switchTab('all')">All Reviews</button>
                </div>

                <!-- Tab Content -->
                <div id="pendingTab" class="tab-content active">
                    <div id="pendingReviews">
                        <div class="loading">Loading pending reviews...</div>
                    </div>
                </div>

                <div id="approvedTab" class="tab-content">
                    <div id="approvedReviews">
                        <div class="loading">Loading approved reviews...</div>
                    </div>
                </div>

                <div id="allTab" class="tab-content">
                    <div id="allReviews">
                        <div class="loading">Loading all reviews...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC_-3gi8bWDy4WGVBIBzsc2bEEG4qe0Qus",
            authDomain: "reviews-48f44.firebaseapp.com",
            databaseURL: "https://reviews-48f44-default-rtdb.firebaseio.com",
            projectId: "reviews-48f44",
            storageBucket: "reviews-48f44.firebasestorage.app",
            messagingSenderId: "978976687091",
            appId: "1:978976687091:web:a9a6cdc13e6570ab598886",
            measurementId: "G-PY6SPKVLES"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let allReviewsData = {};

        // Authentication
        window.authenticate = function() {
            const password = document.getElementById('adminPassword').value;
            // I know my cybersecurity sucks. Please be kind
            if (password === 'fuck you for hacking me') {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadReviews();
            } else {
                alert('Incorrect password');
            }
        };

        // Tab switching
        window.switchTab = function(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
        };

        // Load all reviews
        function loadReviews() {
            const reviewsRef = ref(database, 'reviews');
            
            onValue(reviewsRef, (snapshot) => {
                allReviewsData = {};
                const pending = [];
                const approved = [];
                
                snapshot.forEach((childSnapshot) => {
                    const reviewId = childSnapshot.key;
                    const review = childSnapshot.val();
                    allReviewsData[reviewId] = review;
                    
                    if (review.approved === true) {
                        approved.push({ id: reviewId, ...review });
                    } else {
                        pending.push({ id: reviewId, ...review });
                    }
                });

                // Update statistics
                document.getElementById('statPending').textContent = pending.length;
                document.getElementById('statApproved').textContent = approved.length;
                document.getElementById('statTotal').textContent = pending.length + approved.length;

                // Render reviews
                renderReviews('pendingReviews', pending, false);
                renderReviews('approvedReviews', approved, true);
                renderReviews('allReviews', [...pending, ...approved], null);
            });
        }

        function renderReviews(containerId, reviews, isApproved) {
            const container = document.getElementById(containerId);
            
            if (reviews.length === 0) {
                container.innerHTML = '<div class="empty-state">No reviews to display</div>';
                return;
            }

            // Sort by timestamp (newest first)
            reviews.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            container.innerHTML = reviews.map(review => {
                const date = review.timestamp ? new Date(review.timestamp).toLocaleString() : 'No date';
                const isPending = review.approved !== true;
                
                return `
                    <div class="review-card ${isPending ? 'pending' : ''}">
                        <div class="review-header">
                            <div class="review-info">
                                <div class="review-host">Host: ${escapeHtml(review.hostName)}</div>
                                <div class="review-meta">
                                    by ${escapeHtml(review.user)} • ${date}
                                    ${isPending ? ' • <strong style="color: #ffd700;">PENDING</strong>' : ''}
                                </div>
                            </div>
                            <div class="review-rating">
                                ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)} ${review.rating}/5
                            </div>
                        </div>
                        <div class="review-text">
                            ${escapeHtml(review.text).replace(/\n/g, '<br>')}
                        </div>
                        <div class="review-actions">
                            ${isPending ? 
                                `<button class="btn btn-approve" onclick="window.approveReview('${review.id}')">✓ Approve</button>` :
                                `<button class="btn btn-unapprove" onclick="window.unapproveReview('${review.id}')">↩ Unapprove</button>`
                            }
                            <button class="btn btn-delete" onclick="window.deleteReview('${review.id}')">✗ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Review actions
        window.approveReview = async function(reviewId) {
            if (!confirm('Approve this review?')) return;
            
            try {
                await update(ref(database, `reviews/${reviewId}`), {
                    approved: true
                });
                alert('Review approved successfully!');
            } catch (error) {
                console.error('Error approving review:', error);
                alert('Failed to approve review: ' + error.message);
            }
        };

        window.unapproveReview = async function(reviewId) {
            if (!confirm('Unapprove this review? It will be hidden from the public.')) return;
            
            try {
                await update(ref(database, `reviews/${reviewId}`), {
                    approved: false
                });
                alert('Review unapproved successfully!');
            } catch (error) {
                console.error('Error unapproving review:', error);
                alert('Failed to unapprove review: ' + error.message);
            }
        };

        window.deleteReview = async function(reviewId) {
            if (!confirm('Delete this review permanently? This cannot be undone.')) return;
            
            try {
                await remove(ref(database, `reviews/${reviewId}`));
                alert('Review deleted successfully!');
            } catch (error) {
                console.error('Error deleting review:', error);
                alert('Failed to delete review: ' + error.message);
            }
        };
    </script>
</body>
</html>
