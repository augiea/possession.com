<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Possession.com - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(20, 20, 40, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #4a0080 0%, #6a00a0 100%);
            padding: 30px;
            border-bottom: 2px solid #8a2be2;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #e0b3ff;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
        }

        .logout-btn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 20px;
            background: rgba(231, 76, 60, 0.8);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 1);
        }

        .content {
            padding: 40px;
        }

        .auth-section {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(40, 40, 60, 0.5);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #6a00a0;
        }

        .auth-section h2 {
            color: #e0b3ff;
            margin-bottom: 20px;
            text-align: center;
        }

        .auth-section input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(30, 30, 50, 0.9);
            border: 1px solid #6a00a0;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 16px;
        }

        .auth-section button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-section button:hover {
            background: linear-gradient(90deg, #8a2be2 0%, #9a4be2 100%);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .admin-content {
            display: none;
        }

        .main-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #6a00a0;
        }

        .main-tab {
            padding: 15px 30px;
            background: rgba(40, 40, 60, 0.5);
            border: none;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            color: #b08fd1;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .main-tab:hover {
            background: rgba(60, 60, 80, 0.7);
        }

        .main-tab.active {
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            color: white;
        }

        .main-tab-content {
            display: none;
        }

        .main-tab-content.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(40, 40, 60, 0.5);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #6a00a0;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            color: #e0b3ff;
            font-weight: bold;
        }

        .stat-label {
            color: #b08fd1;
            margin-top: 5px;
        }

        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sub-tab {
            padding: 10px 20px;
            background: rgba(40, 40, 60, 0.5);
            border: none;
            border-radius: 5px;
            color: #b08fd1;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sub-tab:hover {
            background: rgba(60, 60, 80, 0.7);
        }

        .sub-tab.active {
            background: rgba(138, 43, 226, 0.6);
            color: white;
        }

        .sub-tab-content {
            display: none;
        }

        .sub-tab-content.active {
            display: block;
        }

        .card {
            background: rgba(40, 40, 60, 0.5);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 4px solid #8a2be2;
        }

        .card.pending {
            border-left-color: #ffd700;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .card-title {
            color: #e0b3ff;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-meta {
            color: #b08fd1;
            font-size: 0.9em;
        }

        .card-content {
            color: #d0d0d0;
            line-height: 1.6;
            margin: 15px 0;
        }

        .host-preview {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin: 15px 0;
        }

        .host-images {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .host-images img {
            width: 100%;
            border-radius: 5px;
            border: 1px solid #6a00a0;
        }

        .host-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            background: rgba(30, 30, 50, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .detail-label {
            color: #b08fd1;
            font-weight: bold;
            font-size: 0.9em;
        }

        .detail-value {
            color: #e0e0e0;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-approve {
            background: #2ecc71;
            color: white;
        }

        .btn-approve:hover {
            background: #27ae60;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }

        .btn-unapprove {
            background: #f39c12;
            color: white;
        }

        .btn-unapprove:hover {
            background: #d68910;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }

        .btn-export {
            background: #3498db;
            color: white;
        }

        .btn-export:hover {
            background: #2980b9;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #b08fd1;
        }

        .json-output {
            background: rgba(30, 30, 50, 0.9);
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            color: #90ee90;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Admin Panel</h1>
            <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
        </header>

        <div class="content">
            <!-- Authentication Section -->
            <div class="auth-section" id="authSection">
                <h2>Admin Login</h2>
                <input type="email" id="adminEmail" placeholder="Email">
                <input type="password" id="adminPassword" placeholder="Password">
                <button onclick="login()">Login</button>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <!-- Admin Content -->
            <div class="admin-content" id="adminContent">
                <!-- Main Tabs -->
                <div class="main-tabs">
                    <button class="main-tab active" onclick="switchMainTab('reviews')">📝 Reviews</button>
                    <button class="main-tab" onclick="switchMainTab('hosts')">👤 Host Requests</button>
                </div>

                <!-- REVIEWS SECTION -->
                <div id="reviewsSection" class="main-tab-content active">
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number" id="statReviewsPending">0</div>
                            <div class="stat-label">Pending Reviews</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="statReviewsApproved">0</div>
                            <div class="stat-label">Approved Reviews</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="statReviewsTotal">0</div>
                            <div class="stat-label">Total Reviews</div>
                        </div>
                    </div>

                    <div class="sub-tabs">
                        <button class="sub-tab active" onclick="switchSubTab('reviews', 'pending')">Pending</button>
                        <button class="sub-tab" onclick="switchSubTab('reviews', 'approved')">Approved</button>
                        <button class="sub-tab" onclick="switchSubTab('reviews', 'all')">All</button>
                    </div>

                    <div id="reviewsPending" class="sub-tab-content active">
                        <div class="loading">Loading pending reviews...</div>
                    </div>
                    <div id="reviewsApproved" class="sub-tab-content">
                        <div class="loading">Loading approved reviews...</div>
                    </div>
                    <div id="reviewsAll" class="sub-tab-content">
                        <div class="loading">Loading all reviews...</div>
                    </div>
                </div>

                <!-- HOST REQUESTS SECTION -->
                <div id="hostsSection" class="main-tab-content">
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number" id="statHostsPending">0</div>
                            <div class="stat-label">Pending Hosts</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="statHostsApproved">0</div>
                            <div class="stat-label">Approved Hosts</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="statHostsTotal">0</div>
                            <div class="stat-label">Total Requests</div>
                        </div>
                    </div>

                    <div class="sub-tabs">
                        <button class="sub-tab active" onclick="switchSubTab('hosts', 'pending')">Pending</button>
                        <button class="sub-tab" onclick="switchSubTab('hosts', 'approved')">Approved</button>
                        <button class="sub-tab" onclick="switchSubTab('hosts', 'all')">All</button>
                    </div>

                    <div id="hostsPending" class="sub-tab-content active">
                        <div class="loading">Loading pending host requests...</div>
                    </div>
                    <div id="hostsApproved" class="sub-tab-content">
                        <div class="loading">Loading approved hosts...</div>
                    </div>
                    <div id="hostsAll" class="sub-tab-content">
                        <div class="loading">Loading all host requests...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC_-3gi8bWDy4WGVBIBzsc2bEEG4qe0Qus",
            authDomain: "reviews-48f44.firebaseapp.com",
            databaseURL: "https://reviews-48f44-default-rtdb.firebaseio.com",
            projectId: "reviews-48f44",
            storageBucket: "reviews-48f44.firebasestorage.app",
            messagingSenderId: "978976687091",
            appId: "1:978976687091:web:a9a6cdc13e6570ab598886",
            measurementId: "G-PY6SPKVLES"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let allReviews = {};
        let allHosts = {};

        // Authentication
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                loadData();
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });

        window.login = async function() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorMessage = document.getElementById('errorMessage');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMessage.style.display = 'none';
            } catch (error) {
                errorMessage.textContent = 'Invalid email or password';
                errorMessage.style.display = 'block';
            }
        };

        window.logout = async function() {
            await signOut(auth);
        };

        // Tab switching
        window.switchMainTab = function(tabName) {
            document.querySelectorAll('.main-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.main-tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + 'Section').classList.add('active');
        };

        window.switchSubTab = function(section, tabName) {
            const sectionEl = document.getElementById(section + 'Section');
            sectionEl.querySelectorAll('.sub-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            sectionEl.querySelectorAll('.sub-tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(section + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
        };

        // Load data
        function loadData() {
            loadReviews();
            loadHosts();
        }

        function loadReviews() {
            const reviewsRef = ref(database, 'reviews');
            onValue(reviewsRef, (snapshot) => {
                allReviews = {};
                const pending = [];
                const approved = [];
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const review = childSnapshot.val();
                    allReviews[id] = review;
                    
                    if (review.approved === true) {
                        approved.push({ id, ...review });
                    } else {
                        pending.push({ id, ...review });
                    }
                });

                document.getElementById('statReviewsPending').textContent = pending.length;
                document.getElementById('statReviewsApproved').textContent = approved.length;
                document.getElementById('statReviewsTotal').textContent = pending.length + approved.length;

                renderReviews('reviewsPending', pending);
                renderReviews('reviewsApproved', approved);
                renderReviews('reviewsAll', [...pending, ...approved]);
            });
        }

        function loadHosts() {
            const hostsRef = ref(database, 'hostRequests');
            onValue(hostsRef, (snapshot) => {
                allHosts = {};
                const pending = [];
                const approved = [];
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const host = childSnapshot.val();
                    allHosts[id] = host;
                    
                    if (host.approved === true) {
                        approved.push({ id, ...host });
                    } else {
                        pending.push({ id, ...host });
                    }
                });

                document.getElementById('statHostsPending').textContent = pending.length;
                document.getElementById('statHostsApproved').textContent = approved.length;
                document.getElementById('statHostsTotal').textContent = pending.length + approved.length;

                renderHosts('hostsPending', pending);
                renderHosts('hostsApproved', approved);
                renderHosts('hostsAll', [...pending, ...approved]);
            });
        }

        function renderReviews(containerId, reviews) {
            const container = document.getElementById(containerId);
            
            if (reviews.length === 0) {
                container.innerHTML = '<div class="empty-state">No reviews to display</div>';
                return;
            }

            reviews.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            container.innerHTML = reviews.map(review => {
                const date = review.timestamp ? new Date(review.timestamp).toLocaleString() : 'No date';
                const isPending = review.approved !== true;
                
                return `
                    <div class="card ${isPending ? 'pending' : ''}">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Host: ${escapeHtml(review.hostName)}</div>
                                <div class="card-meta">
                                    by ${escapeHtml(review.user)} • ${date}
                                    ${isPending ? ' • <strong style="color: #ffd700;">PENDING</strong>' : ''}
                                </div>
                            </div>
                            <div style="color: #ffd700; font-size: 1.2em;">
                                ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)} ${review.rating}/5
                            </div>
                        </div>
                        <div class="card-content">
                            ${escapeHtml(review.text).replace(/\n/g, '<br>')}
                        </div>
                        <div class="actions">
                            ${isPending ? 
                                `<button class="btn btn-approve" onclick="window.approveReview('${review.id}')">✓ Approve</button>` :
                                `<button class="btn btn-unapprove" onclick="window.unapproveReview('${review.id}')">↩ Unapprove</button>`
                            }
                            <button class="btn btn-delete" onclick="window.deleteReview('${review.id}')">✗ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHosts(containerId, hosts) {
            const container = document.getElementById(containerId);
            
            if (hosts.length === 0) {
                container.innerHTML = '<div class="empty-state">No host requests to display</div>';
                return;
            }

            hosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            container.innerHTML = hosts.map(host => {
                const date = host.timestamp ? new Date(host.timestamp).toLocaleString() : 'No date';
                const isPending = host.approved !== true;
                
                return `
                    <div class="card ${isPending ? 'pending' : ''}">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${escapeHtml(host.name)} (${host.age})</div>
                                <div class="card-meta">
                                    Submitted by ${escapeHtml(host.submittedBy)} • ${date}
                                    ${isPending ? ' • <strong style="color: #ffd700;">PENDING</strong>' : ''}
                                </div>
                            </div>
                        </div>
                        
                        <div class="host-preview">
                            <div class="host-images">
                                ${host.images.slice(0, 3).map((img, i) => 
                                    `<img src="${img}" alt="Photo ${i+1}" onerror="this.style.display='none'">`
                                ).join('')}
                            </div>
                            <div class="host-details">
                                ${host.height ? `<div class="detail-item"><div class="detail-label">Height</div><div class="detail-value">${escapeHtml(host.height)}</div></div>` : ''}
                                ${host.weight ? `<div class="detail-item"><div class="detail-label">Weight</div><div class="detail-value">${escapeHtml(host.weight)}</div></div>` : ''}
                                ${host.breastSize ? `<div class="detail-item"><div class="detail-label">Breast Size</div><div class="detail-value">${escapeHtml(host.breastSize)}</div></div>` : ''}
                                ${host.occupation ? `<div class="detail-item"><div class="detail-label">Occupation</div><div class="detail-value">${escapeHtml(host.occupation)}</div></div>` : ''}
                                <div class="detail-item"><div class="detail-label">Price (1hr)</div><div class="detail-value">$${host.prices['1']}</div></div>
                                <div class="detail-item"><div class="detail-label">Rating</div><div class="detail-value">${'★'.repeat(host.reviews[0].rating)}${'☆'.repeat(5-host.reviews[0].rating)}</div></div>
                            </div>
                        </div>

                        <div class="actions">
                            ${isPending ? 
                                `<button class="btn btn-approve" onclick="window.approveHost('${host.id}')">✓ Approve Host</button>` :
                                `<button class="btn btn-unapprove" onclick="window.unapproveHost('${host.id}')">↩ Unapprove</button>`
                            }
                            <button class="btn btn-export" onclick="window.exportHostJSON('${host.id}')">📋 Export JSON</button>
                            <button class="btn btn-delete" onclick="window.deleteHost('${host.id}')">✗ Delete</button>
                        </div>
                        <div id="json-${host.id}" style="display: none;"></div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Review actions
        window.approveReview = async function(id) {
            if (!confirm('Approve this review?')) return;
            await update(ref(database, `reviews/${id}`), { approved: true });
            alert('Review approved!');
        };

        window.unapproveReview = async function(id) {
            if (!confirm('Unapprove this review?')) return;
            await update(ref(database, `reviews/${id}`), { approved: false });
            alert('Review unapproved!');
        };

        window.deleteReview = async function(id) {
            if (!confirm('Delete this review permanently?')) return;
            await remove(ref(database, `reviews/${id}`));
            alert('Review deleted!');
        };

        // Host actions
        window.approveHost = async function(id) {
            if (!confirm('Approve this host? They will appear on the site.')) return;
            await update(ref(database, `hostRequests/${id}`), { approved: true });
            alert('Host approved! Remember to add their JSON to profile-data.json');
        };

        window.unapproveHost = async function(id) {
            if (!confirm('Unapprove this host?')) return;
            await update(ref(database, `hostRequests/${id}`), { approved: false });
            alert('Host unapproved!');
        };

        window.deleteHost = async function(id) {
            if (!confirm('Delete this host request permanently?')) return;
            await remove(ref(database, `hostRequests/${id}`));
            alert('Host request deleted!');
        };

        window.exportHostJSON = function(id) {
            const host = allHosts[id];
            const jsonDiv = document.getElementById(`json-${id}`);
            
            if (jsonDiv.style.display === 'none') {
                // Create clean JSON for profile-data.json
                const cleanHost = {
                    name: host.name,
                    age: host.age,
                    prices: host.prices,
                    images: host.images,
                    reviews: host.reviews
                };
                
                // Add optional fields
                const optionalFields = ['height', 'weight', 'breastSize', 'occupation', 
                    'relationshipStatus', 'sexualHistory', 'wealth', 'personality', 
                    'libido', 'responsiveness', 'skills'];
                
                optionalFields.forEach(field => {
                    if (host[field]) cleanHost[field] = host[field];
                });

                jsonDiv.innerHTML = `
                    <div class="json-output">${JSON.stringify(cleanHost, null, 2)}</div>
                    <div style="margin-top: 10px; color: #b08fd1; font-size: 0.9em;">
                        ℹ️ Copy this JSON and add it to your profile-data.json file with a unique key (e.g., "${host.name.toLowerCase().replace(/\s+/g, '')}")
                    </div>
                `;
                jsonDiv.style.display = 'block';
            } else {
                jsonDiv.style.display = 'none';
            }
        };
    </script>
</body>
</html>
