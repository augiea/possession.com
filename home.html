            hostCards.splice(12, 0, adCard2);
            
            grid.innerHTML = hostCards.join('');
            
            // Inject ads after DOM is ready
            loadAds();
        }
        
        // Function to load ads dynamically
        function loadAds() {
            const adPlaceholders = document.querySelectorAll('.ad-placeholder');
            
            adPlaceholders.forEach(placeholder => {
                const adId = placeholder.getAttribute('data-ad-id');
                
                // Create ins element
                const ins = document.createElement('ins');
                ins.id = adId;
                ins.setAttribute('data-width', '258');
                ins.setAttribute('data-height', '528');
                
                placeholder.appendChild(ins);
                
                // Push to JuicyAds queue
                if (window.adsbyjuicy) {
                    window.adsbyjuicy.push({'adzone': parseInt(adId)});
                }
            });
        }

        // Navigation functions
        function goToProfile(url) {
            // In a real implementation, this would navigate to the profile page
            window.location.href = url;
        }

        function goToRequest() {
            // Navigate to request page
            window.location.href = 'request.html';
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = hosts.filter(host => 
                host.name.toLowerCase().includes(searchTerm)
            );
            renderHosts(filtered);
        });

        // Filter functionality
        const filters = {
            age: 'all',
            breasts: 'all',
            hair: 'all',
            availability: 'all',
            sort: 'popular'
        };

        document.getElementById('ageFilter').addEventListener('change', (e) => {
            filters.age = e.target.value;
            applyFilters();
        });

        document.getElementById('breastsFilter').addEventListener('change', (e) => {
            filters.breasts = e.target.value;
            applyFilters();
        });

        document.getElementById('hairFilter').addEventListener('change', (e) => {
            filters.hair = e.target.value;
            applyFilters();
        });

        document.getElementById('availabilityFilter').addEventListener('change', (e) => {
            filters.availability = e.target.value;
            applyFilters();
        });

        document.getElementById('sortFilter').addEventListener('change', (e) => {
            filters.sort = e.target.value;
            applyFilters();
        });

        function applyFilters() {
            let filtered = [...hosts];

            // Age filter
            if (filters.age !== 'all') {
                const [min, max] = filters.age.split('-').map(v => v.replace('+', ''));
                filtered = filtered.filter(host => {
                    if (filters.age.includes('+')) {
                        return host.age >= parseInt(min);
                    }
                    return host.age >= parseInt(min) && host.age <= parseInt(max);
                });
            }

            // Hair Color Filter
            if (filters.hair !== 'all') {
                filtered = filtered.filter(host => host.hair === filters.hair);
            }
        
            // Breast Size Filter
            if (filters.breasts !== 'all') {
                filtered = filtered.filter(host => host.breasts === filters.breasts);
            }

            // Availability filter
            if (filters.availability !== 'all') {
                if (filters.availability === 'available') {
                    filtered = filtered.filter(host => !host.isPossessed);
                } else if (filters.availability === 'possessed') {
                    filtered = filtered.filter(host => host.isPossessed);
                }
            }

            // Sort
            switch(filters.sort) {
                case 'newest':
                    filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
                    break;
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'popular':
                    filtered.sort((a, b) => (b.isHot ? 1 : 0) - (a.isHot ? 1 : 0));
                    break;
                case 'price-low':
                    filtered.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filtered.sort((a, b) => b.price - a.price);
                    break;
            }

            renderHosts(filtered);
        }

        // Initial render - ensure DOM is fully loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                renderHosts();
            });
        } else {
            renderHosts();
        }
        
    </script>
