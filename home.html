  <style>
    /* ── Home-page specific styles ─────────────── */

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      padding: 22px 28px;
      background: var(--bg-card);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius-lg);
      margin-bottom: 32px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 130px;
    }
    .filter-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 0;
    }
    .filter-group select {
      padding: 8px 32px 8px 12px;
      font-size: 14px;
      background-color: var(--bg-input);
    }

    .filter-spacer { flex: 1; }

    /* ── Host Grid ─────────────────────────────── */
    .hosts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 860px) { .hosts-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .hosts-grid { grid-template-columns: 1fr; } }

    /* ── Host Card ─────────────────────────────── */
    .host-card {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--purple-border);
      background: var(--bg-card);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    .host-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px var(--purple-glow);
      border-color: rgba(157, 78, 221, 0.6);
    }

    .host-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .host-card:hover .host-img { transform: scale(1.04); }

    /* Gradient overlay */
    .host-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        rgba(5, 0, 15, 0.92) 0%,
        rgba(5, 0, 15, 0.45) 50%,
        transparent 100%);
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .host-name {
      font-family: 'Cinzel', serif;
      font-size: 0.95em;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1.3;
    }
    .host-meta {
      font-size: 0.83em;
      color: rgba(255,255,255,0.7);
      margin-bottom: 5px;
    }
    .host-price {
      font-size: 0.83em;
      font-weight: 600;
      color: var(--accent-green);
    }

    /* Rating chip */
    .host-rating {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--accent-gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Badges */
    .badges {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      backdrop-filter: blur(6px);
    }
    .badge-new       { background: rgba(0, 180, 255, 0.75); color: #fff; }
    .badge-hot       { background: rgba(255, 80, 80, 0.8);  color: #fff; }
    .badge-possessed {
      background: rgba(120, 40, 180, 0.85);
      color: #fff;
      animation: pulse-badge 2s infinite;
    }
    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 6px rgba(157,78,221,0.4); }
      50%       { box-shadow: 0 0 14px rgba(157,78,221,0.8); }
    }

    /* Ad card placeholder */
    .ad-card {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--purple-border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero bar */
    .hero-bar {
      text-align: center;
      padding: 48px 20px 36px;
    }
    .hero-bar h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.6em;
      font-weight: 700;
      color: var(--text-primary);
      text-shadow: 0 0 30px var(--purple-glow);
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }
    .hero-bar p {
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.1em;
    }

    /* Active filter pills */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(157, 78, 221, 0.15);
      border: 1px solid var(--purple-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);

    .filter-pill button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      transition: color var(--transition);
    }
    .filter-pill button:hover { color: var(--accent-red); }

    /* Result count */
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      color: var(--text-dim);
      font-size: 0.88em;
    }
  </style>

    ];

    /* ── State ─────────────────────────────────── */
    let allHosts    = [];
    let searchTerm  = '';
    const filters   = { age:'all', breasts:'all', hair:'all', availability:'all', sort:'rating' };

    /* ── Firebase host loader ──────────────────── */
    function loadFirebaseHosts() {
      const hostsRef     = ref(database, 'hostRequests');
      const approvedQ    = query(hostsRef, orderByChild('approved'), equalTo(true));

      onValue(approvedQ, snapshot => {
        allHosts = [...legacyHosts];

        snapshot.forEach(child => {
          const id   = child.key;
          const host = child.val();
          if (!host.images || !host.images[0]) return;

          allHosts.push({
            id:          'fb_' + id,
            name:        host.name,
            age:         host.age,
            image:       host.images[0],
            rating:      4.5,               // Firebase hosts start neutral
            price:       host.prices?.['1'] ?? 299,
            isNew:       true,
            isHot:       false,
            isPossessed: false,
            hair:        host.hair     || 'Brunette',
            breasts:     host.breasts  || 'Large',
            profileUrl:  `profile-dynamic.html?fb_${id}`
          });
        });

        applyAll();

      }, () => {
        // Firebase failed — still render legacy hosts
        allHosts = [...legacyHosts];
        applyAll();
        showToast('Could not load new host submissions.', 'error');
      });
    }

    /* ── Profile URL resolver ──────────────────── */
    function profileUrl(host) {
      if (host.profileUrl) return host.profileUrl;
      return `profile.html?${host.id}`;
    }

    /* ── Filtering + sorting ───────────────────── */
    function applyAll() {
      let list = [...allHosts];

      // Search
      if (searchTerm) {
        list = list.filter(h => h.name.toLowerCase().includes(searchTerm));
      }

      // Age
      if (filters.age !== 'all') {
        if (filters.age.endsWith('+')) {
          const min = parseInt(filters.age);
          list = list.filter(h => h.age >= min);
        } else {
          const [min, max] = filters.age.split('-').map(Number);
          list = list.filter(h => h.age >= min && h.age <= max);
        }
      }

      // Breasts
      if (filters.breasts !== 'all') list = list.filter(h => h.breasts === filters.breasts);

      // Hair
      if (filters.hair !== 'all') list = list.filter(h => h.hair === filters.hair);

      // Availability
      if (filters.availability === 'available')  list = list.filter(h => !h.isPossessed);
      if (filters.availability === 'possessed')  list = list.filter(h =>  h.isPossessed);

      // Sort
      switch (filters.sort) {
        case 'rating':     list.sort((a,b) => b.rating - a.rating);         break;
        case 'newest':     list.sort((a,b) => (b.isNew?1:0) - (a.isNew?1:0)); break;
        case 'price-low':  list.sort((a,b) => a.price - b.price);           break;
        case 'price-high': list.sort((a,b) => b.price - a.price);           break;
      }

      render(list);
      updatePills();
      updateResultCount(list.length);
    }

    /* ── Render grid ───────────────────────────── */
    function render(hosts) {
      const grid = document.getElementById('hostsGrid');

      if (hosts.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <h3>No hosts found</h3>
            <p>Try adjusting your filters or search term</p>
          </div>`;
        return;
      }

      // Build card HTML
      const cards = hosts.map(h => `
        <div class="host-card" onclick="window.location.href='${escHtml(profileUrl(h))}'" role="button" tabindex="0" aria-label="View ${escHtml(h.name)}'s profile">
          <img class="host-img" src="${escHtml(h.image)}" alt="${escHtml(h.name)}" loading="lazy" onerror="this.style.display='none'">
          <div class="host-overlay">
            <div class="host-name">${escHtml(h.name)}</div>
            <div class="host-meta">${h.age} years old</div>
            <div class="host-price">from $${h.price.toLocaleString()}/hour</div>
          </div>
          <div class="host-rating">⭐ ${h.rating.toFixed(1)}</div>
          ${(h.isNew || h.isHot || h.isPossessed) ? `
            <div class="badges">
              ${h.isNew       ? '<span class="badge badge-new">New</span>'           : ''}
              ${h.isHot       ? '<span class="badge badge-hot">🔥 Hot</span>'        : ''}
              ${h.isPossessed ? '<span class="badge badge-possessed">👻 Possessed</span>' : ''}
            </div>` : ''}
        </div>`);

      // Inject ad cards at fixed intervals (only if enough cards exist)
      const adZones = [1106690, 1106692, 1106774, 1106775];
      const adPositions = [8, 14, 20, 26];
      adPositions.forEach((pos, i) => {
        if (cards.length > pos) {
          cards.splice(pos, 0, `
            <div class="ad-card" aria-hidden="true">
              <ins id="ad_${adZones[i]}" data-width="258" data-height="528"></ins>
            </div>`);
        }
      });

      grid.innerHTML = cards.join('');

      // Activate ad zones after DOM is ready
      requestAnimationFrame(() => {
        adPositions.forEach((pos, i) => {
          const el = document.getElementById(`ad_${adZones[i]}`);
          if (el && window.adsbyjuicy) {
            window.adsbyjuicy.push({ adzone: adZones[i] });
          }
        });
      });
    }

    /* ── Result count ──────────────────────────── */

      document.getElementById('resultCount').textContent =
        n === allHosts.length ? `${n} hosts` : `${n} of ${allHosts.length} hosts`;
    }

    /* ── Active filter pills ───────────────────── */
    function updatePills() {
      const container = document.getElementById('activePills');
      const clearBtn  = document.getElementById('clearFiltersBtn');
      const pills     = [];
      const labels    = { age:'Age', breasts:'Breasts', hair:'Hair', availability:'Availability', sort:'Sort' };

      for (const [key, val] of Object.entries(filters)) {
        if (val === 'all' || (key === 'sort' && val === 'rating')) continue;
        const display = document.getElementById(key + 'Filter')?.selectedOptions[0]?.text || val;
        pills.push(`<span class="filter-pill">${labels[key]}: ${escHtml(display)}<button onclick="clearFilter('${key}')" title="Remove">✕</button></span>`);
      }
      if (searchTerm) pills.push(`<span class="filter-pill">Search: "${escHtml(searchTerm)}"<button onclick="clearSearch()" title="Remove">✕</button></span>`);

      container.innerHTML = pills.join('');
      clearBtn.style.display = pills.length ? '' : 'none';
    }

    window.clearFilter = key => {
      filters[key] = key === 'sort' ? 'rating' : 'all';
      document.getElementById(key + 'Filter').value = filters[key];
      applyAll();
    };
    window.clearSearch = () => {
      searchTerm = '';
      document.getElementById('searchInput').value = '';
      applyAll();
    };

    /* ── Toast helper ──────────────────────────── */
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
      }, 3500);
    }

    /* ── XSS helper ────────────────────────────── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ── Event listeners ───────────────────────── */
    document.getElementById('searchInput').addEventListener('input', e => {
      searchTerm = e.target.value.toLowerCase().trim();
      applyAll();
    });

    ['ageFilter','breastsFilter','hairFilter','availabilityFilter','sortFilter'].forEach(id => {
      document.getElementById(id).addEventListener('change', e => {
        const key = id.replace('Filter','');
        filters[key] = e.target.value;
        applyAll();
      });
    });

    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      Object.keys(filters).forEach(k => filters[k] = k === 'sort' ? 'rating' : 'all');
      searchTerm = '';
      document.getElementById('searchInput').value = '';
      ['ageFilter','breastsFilter','hairFilter','availabilityFilter'].forEach(id =>
        document.getElementById(id).value = 'all');
      document.getElementById('sortFilter').value = 'rating';
      applyAll();
    });

    // Keyboard accessibility for cards
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.classList.contains('host-card')) {
        e.target.click();
      }
    });

    /* ── Boot ──────────────────────────────────── */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadFirebaseHosts);
    } else {
      loadFirebaseHosts();
    }
  </script>
