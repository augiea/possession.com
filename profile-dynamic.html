<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 Possession.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: rgba(20, 20, 40, 0.95);
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            font-size: 24px;
            text-decoration: none;
            color: #e0b3ff;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.2);
        }

        h1 {
            font-size: 2em;
            color: #e0b3ff;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
        }

        .content {
            background: rgba(20, 20, 40, 0.95);
            padding: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 0 0 15px 15px;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            color: #b08fd1;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(138, 43, 226, 0.4);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            transition: all 0.3s;
            cursor: pointer;
        }

        .gallery img:hover {
            border-color: #8a2be2;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(40, 40, 60, 0.6);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .info-label {
            color: #9a9a9a;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: #e0e0e0;
            font-size: 1.3em;
            font-weight: 600;
        }

        .review-card {
            background: rgba(40, 40, 60, 0.6);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #8a2be2;
            margin-bottom: 15px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .review-author {
            color: #e0b3ff;
            font-weight: 600;
            font-size: 1.1em;
        }

        .review-rating {
            color: #ffd700;
            font-size: 1.2em;
        }

        .review-text {
            color: #d0d0d0;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .review-date {
            color: #9a9a9a;
            font-size: 0.85em;
        }

        .write-review-btn {
            display: inline-block;
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .write-review-btn:hover {
            background: linear-gradient(90deg, #8a2be2 0%, #9a4be2 100%);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }

        .booking-form {
            background: rgba(40, 40, 60, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(138, 43, 226, 0.4);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #b08fd1;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        select, input[type="radio"] {
            margin-right: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(30, 30, 50, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(138, 43, 226, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            background: rgba(40, 40, 60, 0.8);
            border-color: rgba(138, 43, 226, 0.5);
        }

        .radio-option input[type="radio"] {
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            flex: 1;
            font-size: 1em;
        }

        .addon-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 15px;
            background: rgba(30, 30, 50, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(138, 43, 226, 0.2);
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .addon-option:hover {
            background: rgba(40, 40, 60, 0.8);
            border-color: rgba(138, 43, 226, 0.5);
        }

        .addon-content {
            flex: 1;
        }

        .addon-title {
            color: #e0b3ff;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .addon-description {
            color: #b0b0b0;
            font-size: 0.9em;
        }

        .total-cost {
            background: linear-gradient(135deg, #4a0080 0%, #6a00a0 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            text-align: center;
        }

        .total-label {
            color: #b08fd1;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .total-amount {
            color: #90ee90;
            font-size: 2.5em;
            font-weight: 700;
        }

        .possess-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #6a00a0 0%, #8a2be2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .possess-btn:hover {
            background: linear-gradient(90deg, #8a2be2 0%, #9a4be2 100%);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.8);
            transform: translateY(-3px);
        }

        .warning {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #ffb3b3;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.5em;
            color: #b08fd1;
        }

        .error {
            text-align: center;
            padding: 60px;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="home.html" class="back-btn" title="Back to Home">←</a>
            <h1 id="pageTitle">👻 Possession.com</h1>
        </header>

        <div class="content" id="mainContent">
            <div class="loading">Loading profile...</div>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get, query, orderByChild, equalTo, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC_-3gi8bWDy4WGVBIBzsc2bEEG4qe0Qus",
            authDomain: "reviews-48f44.firebaseapp.com",
            databaseURL: "https://reviews-48f44-default-rtdb.firebaseio.com",
            projectId: "reviews-48f44",
            storageBucket: "reviews-48f44.firebasestorage.app",
            messagingSenderId: "978976687091",
            appId: "1:978976687091:web:a9a6cdc13e6570ab598886"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Get host ID from URL
        const hostId = window.location.search.substring(1);
        const isFirebaseHost = hostId.startsWith('fb_');

        // Pricing data
        let pricingData = {};

        async function loadProfile() {
            try {
                if (isFirebaseHost) {
                    const firebaseId = hostId.replace('fb_', '');
                    const hostRef = ref(database, `hostRequests/${firebaseId}`);
                    const snapshot = await get(hostRef);
                    
                    if (snapshot.exists()) {
                        const hostData = snapshot.val();
                        
                        if (!hostData.approved) {
                            showError('This host is pending approval.');
                            return;
                        }
                        
                        renderProfile(hostData);
                    } else {
                        showError('Host not found.');
                    }
                } else {
                    const response = await fetch('profile-data.json');
                    const data = await response.json();
                    const host = data.profiles[hostId];
                    
                    if (host) {
                        renderProfile(host, true);
                    } else {
                        showError('Host not found.');
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                showError('Error loading profile. Please try again.');
            }
        }

        function renderProfile(host, isLegacy = false) {
            document.title = `👻 Possession.com - ${host.name}`;
            
            // Build profile info items dynamically
            let profileItems = '';
            
            if (host.age) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Age</div>
                        <div class="info-value">${host.age} years</div>
                    </div>
                `;
            }
            
            if (host.height) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Height</div>
                        <div class="info-value">${host.height}</div>
                    </div>
                `;
            }
            
            if (host.weight) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Weight</div>
                        <div class="info-value">${host.weight}</div>
                    </div>
                `;
            }
            
            if (host.hair) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Hair</div>
                        <div class="info-value">${host.hair}</div>
                    </div>
                `;
            }
            
            if (host.breasts) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Breasts</div>
                        <div class="info-value">${host.breasts}</div>
                    </div>
                `;
            }
            
            if (host.ethnicity) {
                profileItems += `
                    <div class="info-item">
                        <div class="info-label">Ethnicity</div>
                        <div class="info-value">${host.ethnicity}</div>
                    </div>
                `;
            }

            // Rating
            const rating = isLegacy ? (host.rating || 5.0) : (host.reviews[0]?.rating || 5.0);
            profileItems += `
                <div class="info-item">
                    <div class="info-label">Rating</div>
                    <div class="info-value">⭐ ${rating}</div>
                </div>
            `;

            // Set pricing data for calculator
            if (isLegacy) {
                // Legacy format: { "1 Hour": 299, "3 Hours": 799, ... }
                pricingData = host.pricing || {};
            } else {
                // Firebase format: { "1": 299, "3": 799, "24": 2499, "168": 14999 }
                pricingData = {
                    "1 Hour": host.prices['1'] || 0,
                    "3 Hours": host.prices['3'] || 0,
                    "24 Hours": host.prices['24'] || 0,
                    "1 Week": host.prices['168'] || 0
                };
            }

            // Build reviews
            let reviewsHTML = '';
            const reviews = isLegacy ? (host.reviews || []) : (host.reviews || []);
            
            reviews.forEach(review => {
                const author = review.author || review.reviewerName || 'Anonymous';
                const text = review.text || review.reviewText || '';
                const reviewRating = review.rating || 5;
                const timestamp = review.timestamp || review.date || Date.now();
                
                reviewsHTML += `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="review-author">${author}</div>
                            <div class="review-rating">${'⭐'.repeat(Math.round(reviewRating))}</div>
                        </div>
                        <div class="review-text">${text}</div>
                        <div class="review-date">${new Date(timestamp).toLocaleDateString()}</div>
                    </div>
                `;
            });

            const content = `
                <section>
                    <h2>📸 Host Gallery</h2>
                    <div class="gallery">
                        ${host.images.map(img => `<img src="${img}" alt="${host.name}">`).join('')}
                    </div>
                </section>

                <section>
                    <h2>📋 Host Profile</h2>
                    <div class="profile-info">
                        ${profileItems}
                    </div>
                </section>

                <section>
                    <h2>⭐ User Reviews</h2>
                    <div id="reviewsContainer">${reviewsHTML}</div>
                    <a href="submit-review.html" class="write-review-btn">✍️ Write a Review</a>
                </section>

                <section>
                    <h2>🎯 Possession Options</h2>
                    <div class="booking-form">
                        <div class="form-group">
                            <label>Duration:</label>
                            <select id="duration" onchange="updateTotal()">
                                ${Object.keys(pricingData).map(duration => 
                                    `<option value="${duration}">${duration} - $${pricingData[duration]}</option>`
                                ).join('')}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Preferred Start Time:</label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="immediate" name="startTime" value="immediate" checked>
                                    <label for="immediate">Immediate: Possess right now</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="morning" name="startTime" value="morning">
                                    <label for="morning">Morning (6AM-12PM)</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="afternoon" name="startTime" value="afternoon">
                                    <label for="afternoon">Afternoon (12PM-6PM)</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="evening" name="startTime" value="evening">
                                    <label for="evening">Evening (6PM-12AM)</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="night" name="startTime" value="night">
                                    <label for="night">Night (12AM-6AM)</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="addon-option">
                                <input type="checkbox" id="memoryPackage" onchange="updateTotal()">
                                <div class="addon-content">
                                    <div class="addon-title">Include Full Memory Package (+$1,500)</div>
                                    <div class="addon-description">Access to complete memories, skills, and personality nuances</div>
                                </div>
                            </div>

                            <div class="addon-option">
                                <input type="checkbox" id="insurance" onchange="updateTotal()">
                                <div class="addon-content">
                                    <div class="addon-title">Possession Insurance (+$499)</div>
                                    <div class="addon-description">Protection against unexpected host resistance or early termination</div>
                                </div>
                            </div>
                        </div>

                        <div class="total-cost">
                            <div class="total-label">Total Cost:</div>
                            <div class="total-amount" id="totalCost">$${Object.values(pricingData)[0]}</div>
                        </div>

                        <button class="possess-btn">👻 INITIATE POSSESSION</button>

                        <div class="warning">
                            ⚠️ <strong>Warning:</strong> All possessions are subject to our Terms of Service. Host consciousness will be temporarily suspended. Any actions taken during possession are the responsibility of the possessing entity. Memories created during possession will be retained by the host upon session completion.
                        </div>
                    </div>
                </section>
            `;

            document.getElementById('mainContent').innerHTML = content;

            // Load additional Firebase reviews
            if (isLegacy || !isLegacy) {
                loadFirebaseReviews(host.name);
            }
        }

        function loadFirebaseReviews(hostName) {
            const reviewsRef = ref(database, 'reviews');
            const approvedQuery = query(reviewsRef, orderByChild('approved'), equalTo(true));

            onValue(approvedQuery, (snapshot) => {
                const firebaseReviews = [];
                snapshot.forEach((childSnapshot) => {
                    const review = childSnapshot.val();
                    if (review.hostName === hostName) {
                        firebaseReviews.push(review);
                    }
                });

                if (firebaseReviews.length > 0) {
                    const container = document.getElementById('reviewsContainer');
                    const firebaseReviewsHTML = firebaseReviews.map(review => `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-author">${review.reviewerName}</div>
                                <div class="review-rating">${'⭐'.repeat(Math.round(review.rating))}</div>
                            </div>
                            <div class="review-text">${review.reviewText}</div>
                            <div class="review-date">${new Date(review.timestamp).toLocaleDateString()}</div>
                        </div>
                    `).join('');
                    
                    container.innerHTML += firebaseReviewsHTML;
                }
            });
        }

        function showError(message) {
            document.getElementById('mainContent').innerHTML = `
                <div class="error">
                    <h2>${message}</h2>
                    <p><a href="home.html" style="color: #8a2be2;">Return to home</a></p>
                </div>
            `;
        }

        // Make updateTotal global
        window.updateTotal = function() {
            const duration = document.getElementById('duration').value;
            const memoryPackage = document.getElementById('memoryPackage').checked;
            const insurance = document.getElementById('insurance').checked;

            let total = pricingData[duration] || 0;
            if (memoryPackage) total += 1500;
            if (insurance) total += 499;

            document.getElementById('totalCost').textContent = `$${total.toLocaleString()}`;
        };

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
