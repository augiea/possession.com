<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Possession.com — Host Profile</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Profile-page specific styles ─────────── */

    /* Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .gallery-item {
      aspect-ratio: 3 / 4;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--purple-border);
      background: var(--bg-input);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 30px var(--purple-glow);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-style: italic;
      font-size: 0.88em;
    }

    /* Profile stats grid */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .profile-item {
      padding: 14px 16px;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--purple-mid);
    }
    .profile-label {
      display: block;
      color: var(--text-dim);
      font-size: 0.78em;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .profile-value {
      color: var(--text-primary);
      font-size: 1em;
    }

    /* Reviews */
    .reviews-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Pricing panel */
    .pricing-panel {
      background: var(--bg-card);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
    }
    .pricing-panel .card-title { margin-bottom: 24px; }

    .option-row {
      margin-bottom: 22px;
    }
    .option-row label { margin-bottom: 8px; }

    .add-on-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    .add-on-item {
      background: var(--bg-input);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      transition: border-color var(--transition);
    }
    .add-on-item:has(input:checked) { border-color: var(--purple-mid); }
    .add-on-desc {
      color: var(--text-dim);
      font-size: 0.83em;
      margin-top: 5px;
      padding-left: 30px;
    }

    .total-box {
      background: var(--bg-input);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      margin: 24px 0;
    }
    .total-label {
      font-family: 'Cinzel', serif;
      font-size: 0.78em;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .total-amount {
      font-family: 'Cinzel', serif;
      font-size: 2.4em;
      font-weight: 700;
      color: var(--accent-green);
      text-shadow: 0 0 20px rgba(110, 231, 183, 0.3);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 4000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      font-size: 2em;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      opacity: 0.7;
      transition: opacity var(--transition);
    }
    .lightbox-close:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ── Navigation ──────────────────────────── -->
  <header class="site-header">
    <div class="nav-container">
      <a href="home.html" class="nav-logo">
        <span class="nav-logo-icon">👻</span>
        Possession.com
      </a>
      <div class="nav-actions">
        <a href="home.html" class="nav-btn nav-btn-ghost">← Browse Hosts</a>
      </div>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────── -->
  <main class="page-wrap" id="pageMain">
    <!-- Content injected by JS -->
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading host profile…</p>
    </div>
  </main>

  <!-- ── Lightbox ─────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <!-- ── Possession Confirm Modal ─────────────── -->
  <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-icon">👻</div>
      <div class="modal-title" id="modalTitle">Confirm Possession</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">✓ Confirm</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ── Firebase (module) ─────────────────────── -->
  <script type="module">
    import { initializeApp }                                              from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, get, push, query, orderByChild, equalTo,
             onValue, serverTimestamp }                                   from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    /* ── Firebase config ───────────────────────── */
    const firebaseConfig = {
      apiKey:            "AIzaSyC_-3gi8bWDy4WGVBIBzsc2bEEG4qe0Qus",
      authDomain:        "reviews-48f44.firebaseapp.com",
      databaseURL:       "https://reviews-48f44-default-rtdb.firebaseio.com",
      projectId:         "reviews-48f44",
      storageBucket:     "reviews-48f44.firebasestorage.app",
      messagingSenderId: "978976687091",
      appId:             "1:978976687091:web:a9a6cdc13e6570ab598886"
    };
    const app      = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    /* ── URL parsing ───────────────────────────── */
    const urlParams  = new URLSearchParams(window.location.search);
    const PROFILE_ID = urlParams.has('id')
      ? urlParams.get('id')
      : Array.from(urlParams.keys())[0] || 'maria';
    const IS_FIREBASE = PROFILE_ID.startsWith('fb_');

    /* ── State ─────────────────────────────────── */
    let profileData = null;
    const PRICES    = { memories: 1500, insurance: 499 };

    /* ── Load profile ──────────────────────────── */
    async function loadProfile() {
      try {
        if (IS_FIREBASE) {
          await loadFirebaseProfile();
        } else {
          await loadJsonProfile();
        }
        renderPage();
        loadReviews();
      } catch (err) {
        console.error(err);
        showError('Failed to load host profile. Returning to browse…');
        setTimeout(() => window.location.href = 'home.html', 2500);
      }
    }

    async function loadFirebaseProfile() {
      const fbId      = PROFILE_ID.replace('fb_', '');
      const hostRef   = ref(database, `hostRequests/${fbId}`);
      const snapshot  = await get(hostRef);

      if (!snapshot.exists()) throw new Error('Host not found');
      const host = snapshot.val();
      if (!host.approved) {
        showError('This host is pending approval.');
        setTimeout(() => window.location.href = 'home.html', 2000);
        throw new Error('Not approved');
      }

      profileData = {
        name:               host.name,
        age:                host.age,
        height:             host.height,
        weight:             host.weight,
        breastSize:         host.breastSize,
        occupation:         host.occupation,
        relationshipStatus: host.relationshipStatus,
        sexualHistory:      host.sexualHistory,
        wealth:             host.wealth,
        personality:        host.personality,
        libido:             host.libido,
        responsiveness:     host.responsiveness,
        skills:             host.skills,
        images:             host.images || [],
        prices:             host.prices || { '1':299,'4':999,'24':1999,'168':9999,'720':29999 },
        reviews:            (host.reviews || []).map(r => ({ user:r.user, rating:r.rating, text:r.text }))
      };
    }

    async function loadJsonProfile() {
      // Fetch from profile-data.json served relative to the page
      // (Do NOT fetch from raw.githubusercontent.com — use the deployed file)
      const resp = await fetch('profile-data.json');
      if (!resp.ok) throw new Error('JSON fetch failed');
      const all  = await resp.json();

      // profile-data.json may be structured as { profiles: { id: {...} } } or { id: {...} }
      const root = all.profiles || all;
      profileData = root[PROFILE_ID];
      if (!profileData) throw new Error(`No profile for key: ${PROFILE_ID}`);
    }

    /* ── Render full page ──────────────────────── */
    function renderPage() {
      document.title = `${profileData.name} — Possession.com`;
      document.getElementById('pageMain').innerHTML = buildPageHTML();

      // Wire up pricing controls
      document.getElementById('duration')  .addEventListener('change', updateTotal);
      document.getElementById('memories')  .addEventListener('change', updateTotal);
      document.getElementById('insurance') .addEventListener('change', updateTotal);
      updateTotal();

      // Wire up possess button
      document.getElementById('possessBtn').addEventListener('click', openConfirmModal);

      // Wire up gallery lightbox
      document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.src));
      });
    }

    function buildPageHTML() {
      const p      = profileData;
      const images = (p.images || []).map((src, i) => `
        <div class="gallery-item">
          <img src="${esc(src)}" alt="${esc(p.name)} photo ${i+1}"
               loading="${i===0?'eager':'lazy'}"
               onerror="this.parentElement.innerHTML='<div class=\\'gallery-placeholder\\'>Image unavailable</div>'">
        </div>`).join('');

      const stats = buildStats(p);

      const priceOpts = Object.entries(p.prices || {})
        .sort((a,b) => Number(a[0]) - Number(b[0]))
        .map(([hours, price]) => {
          const label = hours==='1'?'1 Hour' : hours==='4'?'4 Hours' : hours==='24'?'24 Hours' : hours==='168'?'1 Week' : '1 Month';
          return `<option value="${hours}" data-price="${price}">${label} — $${Number(price).toLocaleString()}</option>`;
        }).join('');

      return `
        <a href="home.html" class="back-link">← Back to Browse</a>

        <!-- Gallery -->
        <div class="card">
          <div class="card-title">📸 Host Gallery</div>
          <div class="gallery-grid">${images || '<p class="text-muted">No images available</p>'}</div>
        </div>

        <!-- Profile -->
        <div class="card">
          <div class="card-title">📋 Host Profile — ${esc(p.name)}</div>
          <div class="profile-grid" id="profileGrid">${stats}</div>
        </div>

        <!-- Reviews -->
        <div class="card">
          <div class="reviews-header">
            <div class="card-title" style="margin:0;border:0;padding:0;">⭐ Reviews</div>
            <a href="submit-review.html?host=${encodeURIComponent(p.name)}" class="btn btn-ghost" style="font-size:0.85em;">✍️ Write a Review</a>
          </div>
          <div id="reviewsContainer">
            <div class="loading-state"><div class="loading-spinner"></div></div>
          </div>
        </div>

        <!-- Pricing -->
        <div class="pricing-panel">
          <div class="card-title">🎯 Possession Options</div>

          <div class="option-row">
            <label for="duration">Duration</label>
            <select id="duration">${priceOpts}</select>
          </div>

          <div class="option-row">
            <label for="time">Preferred Start Time</label>
            <select id="time">
              <option value="immediate">Immediate — possess right now</option>
              <option value="morning">Morning (6 AM – 12 PM)</option>
              <option value="afternoon">Afternoon (12 PM – 6 PM)</option>
              <option value="evening">Evening (6 PM – 12 AM)</option>
              <option value="night">Night (12 AM – 6 AM)</option>
            </select>
          </div>

          <div class="add-on-row">
            <div class="add-on-item">
              <div class="checkbox-row">
                <input type="checkbox" id="memories">
                <label for="memories">Full Memory Package <span class="text-muted">(+$${PRICES.memories.toLocaleString()})</span></label>
              </div>
              <p class="add-on-desc">Access complete memories, skills, and personality nuances</p>
            </div>
            <div class="add-on-item">
              <div class="checkbox-row">
                <input type="checkbox" id="insurance">
                <label for="insurance">Possession Insurance <span class="text-muted">(+$${PRICES.insurance.toLocaleString()})</span></label>
              </div>
              <p class="add-on-desc">Protection against unexpected host resistance or early termination</p>
            </div>
          </div>

          <div class="total-box">
            <div class="total-label">Total Cost</div>
            <div class="total-amount" id="totalCost">—</div>
          </div>

          <button class="btn btn-possess" id="possessBtn">
            👻 INITIATE POSSESSION
          </button>

          <div class="warning-banner mt-16">
            ⚠️ All possessions are subject to our Terms of Service. Host consciousness will be temporarily suspended.
            Any actions taken during possession are the full responsibility of the possessing entity.
            Memories created during possession will be retained by the host upon session completion.
          </div>
        </div>`;
    }

    function buildStats(p) {
      const rows = [
        ['Name',               p.name],
        ['Age',                p.age ? `${p.age} years` : null],
        ['Height',             p.height],
        ['Weight',             p.weight],
        ['Breast Size',        p.breastSize],
        ['Occupation',         p.occupation],
        ['Relationship',       p.relationshipStatus],
        ['Sexual History',     p.sexualHistory],
        ['Wealth',             p.wealth],
        ['Personality',        p.personality],
        ['Libido',             p.libido],
        ['Responsiveness',     p.responsiveness],
        ['Memory Package Skills', p.skills],
      ];
      return rows
        .filter(([,v]) => v != null && v !== '')
        .map(([label, value]) => `
          <div class="profile-item">
            <span class="profile-label">${esc(label)}</span>
            <span class="profile-value">${esc(String(value))}</span>
          </div>`).join('');
    }

    /* ── Pricing ───────────────────────────────── */
    function updateTotal() {
      const sel       = document.getElementById('duration');
      const basePrice = Number(sel.selectedOptions[0]?.dataset.price || 0);
      const memories  = document.getElementById('memories').checked  ? PRICES.memories  : 0;
      const insurance = document.getElementById('insurance').checked ? PRICES.insurance : 0;
      const total     = basePrice + memories + insurance;
      document.getElementById('totalCost').textContent = '$' + total.toLocaleString();
      return { basePrice, total };
    }

    /* ── Confirm modal ─────────────────────────── */
    function openConfirmModal() {
      const durSel   = document.getElementById('duration');
      const timeSel  = document.getElementById('time');
      const memories = document.getElementById('memories').checked;
      const insurance= document.getElementById('insurance').checked;
      const { total }= updateTotal();

      const durText  = durSel.selectedOptions[0].text;
      const timeText = timeSel.selectedOptions[0].text;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-row"><span class="modal-row-label">Host</span><span class="modal-row-value">${esc(profileData.name)}</span></div>
        <div class="modal-row"><span class="modal-row-label">Duration</span><span class="modal-row-value">${esc(durText)}</span></div>
        <div class="modal-row"><span class="modal-row-label">Start Time</span><span class="modal-row-value">${esc(timeText)}</span></div>
        <div class="modal-row"><span class="modal-row-label">Memory Package</span><span class="modal-row-value">${memories?'Yes':'No'}</span></div>
        <div class="modal-row"><span class="modal-row-label">Insurance</span><span class="modal-row-value">${insurance?'Yes':'No'}</span></div>
        <div class="modal-row modal-total"><span class="modal-row-label">Total</span><span class="modal-row-value">$${total.toLocaleString()}</span></div>`;

      document.getElementById('confirmModal').classList.add('open');
      document.getElementById('modalConfirm').onclick = () => submitSession({ durText, timeText, memories, insurance, total });
    }

    document.getElementById('modalCancel').addEventListener('click', () =>
      document.getElementById('confirmModal').classList.remove('open'));

    document.getElementById('confirmModal').addEventListener('click', e => {
      if (e.target === document.getElementById('confirmModal'))
        document.getElementById('confirmModal').classList.remove('open');
    });

    /* ── Submit session to Firebase ────────────── */
    async function submitSession({ durText, timeText, memories, insurance, total }) {
      const confirmBtn = document.getElementById('modalConfirm');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Submitting…';

      const sessionData = {
        hostName:       profileData.name,
        hostProfileId:  PROFILE_ID,
        duration:       document.getElementById('duration').value,
        durationText:   durText,
        startTime:      document.getElementById('time').value,
        startTimeText:  timeText,
        memories,
        insurance,
        totalCost:      total,
        status:         'pending',
        timestamp:      serverTimestamp()
      };

      try {
        const sessionsRef = ref(database, 'sessions');
        const result      = await push(sessionsRef, sessionData);
        document.getElementById('confirmModal').classList.remove('open');
        showToast('🌀 Possession request submitted! Connecting to host consciousness…', 'success');
        confirmBtn.textContent = '✓ Submitted';
      } catch (err) {
        console.error(err);
        showToast('Failed to submit request. Please try again.', 'error');
        confirmBtn.disabled   = false;
        confirmBtn.textContent = '✓ Confirm';
      }
    }

    /* ── Reviews ───────────────────────────────── */
    function loadReviews() {
      const container   = document.getElementById('reviewsContainer');
      const reviewsRef  = ref(database, 'reviews');
      const hostQuery   = query(reviewsRef, orderByChild('hostName'), equalTo(profileData.name));
      const jsonReviews = (profileData.reviews || []).map(r => ({
        user: r.user, rating: r.rating, text: r.text, timestamp: null
      }));

      onValue(hostQuery, snapshot => {
        const fbReviews = [];
        snapshot.forEach(child => {
          const r = child.val();
          if (r.approved === true) {
            fbReviews.push({ user: r.reviewerName, rating: r.rating, text: r.reviewText, timestamp: r.timestamp });
          }
        });

        const all = [...jsonReviews, ...fbReviews]
          .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

        if (all.length === 0) {
          container.innerHTML = `<div class="reviews-empty">No reviews yet — be the first to review this host!</div>`;
          return;
        }

        container.innerHTML = all.map(r => {
          const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString() : '';
          return `
            <div class="review-card">
              <div class="review-header">
                <span class="review-user">${esc(r.user)}</span>
                <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)} ${r.rating}/5</span>
              </div>
              <div class="review-text">${esc(r.text).replace(/\n/g,'<br>')}</div>
              ${date ? `<div class="review-date">${date}</div>` : ''}
            </div>`;
        }).join('');

      }, () => {
        // Firebase unavailable — fall back to JSON reviews
        if (jsonReviews.length === 0) {
          container.innerHTML = `<div class="reviews-empty">Reviews temporarily unavailable.</div>`;
        } else {
          container.innerHTML = jsonReviews.map(r => `
            <div class="review-card">
              <div class="review-header">
                <span class="review-user">${esc(r.user)}</span>
                <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)} ${r.rating}/5</span>
              </div>
              <div class="review-text">${esc(r.text).replace(/\n/g,'<br>')}</div>
            </div>`).join('');
        }
      });
    }

    /* ── Lightbox ──────────────────────────────── */
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('lightboxClose').addEventListener('click', () =>
      document.getElementById('lightbox').classList.remove('open'));
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('lightbox'))
        document.getElementById('lightbox').classList.remove('open');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('open');
        document.getElementById('confirmModal').classList.remove('open');
      }
    });

    /* ── Error helper ──────────────────────────── */
    function showError(msg) {
      document.getElementById('pageMain').innerHTML = `
        <div class="empty-state">
          <h3>⚠️ ${esc(msg)}</h3>
          <a href="home.html" class="btn btn-ghost mt-16">← Browse Hosts</a>
        </div>`;
    }

    /* ── Toast helper ──────────────────────────── */
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
      }, 4000);
    }

    /* ── XSS escape ────────────────────────────── */
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ── Boot ──────────────────────────────────── */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadProfile);
    } else {
      loadProfile();
    }
  </script>
</body>
</html>
